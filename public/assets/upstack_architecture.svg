<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <!-- Background & Hairline Grid -->
  <rect width="1200" height="675" fill="#09090b" />
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Outer Border & Technical Frame -->
  <rect x="20" y="20" width="1160" height="635" fill="none" stroke="#27272a" stroke-width="1.5" />

  <!-- Header Metadata Bar -->
  <line x1="20" y1="70" x2="1180" y2="70" stroke="#27272a" stroke-width="1" />
  <rect x="40" y="38" width="8" height="8" fill="#ea580c" />
  <text x="60" y="47" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ea580c" font-weight="600" letter-spacing="0.1em">SYS.ARCH // UPSTACK ENGINE</text>
  <text x="320" y="47" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717a">MULTI-AGENT PORTFOLIO INTELLIGENCE PLATFORM</text>
  <text x="1000" y="47" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a1a1aa">STATUS: ENTERPRISE READY</text>

  <!-- Layer 1: Client & Presentation Layer -->
  <g transform="translate(60, 95)">
    <rect width="1080" height="75" fill="#121215" stroke="#27272a" stroke-width="1" />
    <text x="25" y="28" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ea580c" font-weight="600">LAYER 01 // PRESENTATION &amp; COPILOT INTERFACE</text>
    <text x="25" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#f4f4f5" font-weight="700">React 18 Dashboard</text>
    <text x="220" y="52" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717a">·</text>
    <text x="245" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#f4f4f5" font-weight="700">Conversational AI Chat</text>
    <text x="460" y="52" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717a">·</text>
    <text x="485" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#f4f4f5" font-weight="700">Portfolio Analytics UI</text>
    <text x="700" y="52" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717a">·</text>
    <text x="725" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#f4f4f5" font-weight="700">Real-Time WebSocket Feed</text>
  </g>

  <!-- Connectors -->
  <line x1="600" y1="170" x2="600" y2="195" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Layer 2: API Gateway Layer -->
  <g transform="translate(60, 195)">
    <rect width="1080" height="60" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="25" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a" font-weight="600">LAYER 02 // API ROUTING &amp; SECURITY</text>
    <text x="25" y="44" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f4f4f5">API Gateway · JWT Token Lifecycle · Granular Rate Limiting · Request Telemetry</text>
  </g>

  <!-- Connectors -->
  <line x1="600" y1="255" x2="600" y2="280" stroke="#ea580c" stroke-width="1.5" />

