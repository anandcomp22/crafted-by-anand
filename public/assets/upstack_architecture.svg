    <text x="275" y="92" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">Health &amp; Holdings</text>
    <text x="275" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">Asset Allocation Logic</text>

    <!-- Market Agent -->
    <rect x="460" y="45" width="185" height="90" fill="#09090b" stroke="#27272a" stroke-width="1" />
    <text x="475" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#f4f4f5" font-weight="700">Market Agent</text>
    <text x="475" y="92" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">Real-Time Data Feeds</text>
    <text x="475" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">Technical Indicators</text>

    <!-- Risk Agent -->
    <rect x="660" y="45" width="185" height="90" fill="#09090b" stroke="#27272a" stroke-width="1" />
    <text x="675" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#f4f4f5" font-weight="700">Risk Agent</text>
    <text x="675" y="92" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">VaR &amp; Exposure Analysis</text>
    <text x="675" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">Sector Concentration</text>

    <!-- Recommendation & Explanation -->
    <rect x="860" y="45" width="195" height="90" fill="#09090b" stroke="#27272a" stroke-width="1" />
    <text x="875" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#f4f4f5" font-weight="700">Optimization &amp; Expl.</text>
    <text x="875" y="92" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">Rebalancing Strategy</text>
    <text x="875" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">Human-Readable Rationale</text>
