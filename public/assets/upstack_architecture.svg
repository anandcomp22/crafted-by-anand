    <text x="40" y="92" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ea580c">Workflow Orchestration</text>
    <text x="40" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">Intent &amp; Task Dispatch</text>

