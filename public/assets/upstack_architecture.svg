  <!-- Connectors -->
  <line x1="600" y1="435" x2="600" y2="460" stroke="#ea580c" stroke-width="1.5" />

  <!-- Layer 4: Model Context Protocol (MCP) -->
  <g transform="translate(60, 460)">
    <rect width="1080" height="55" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="25" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ea580c" font-weight="600">LAYER 04 // MODEL CONTEXT PROTOCOL (MCP) TOOL INTEGRATION</text>
    <text x="25" y="41" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f4f4f5">Standardized Tool Bridge: Portfolio Queries · Market Ingestion · Risk Calculations · Strategy Optimization</text>
  </g>

  <!-- Connectors -->
  <line x1="600" y1="515" x2="600" y2="538" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Layer 5: Infrastructure & Event-Driven Backbone -->
  <g transform="translate(60, 538)">
    <rect width="1080" height="85" fill="#121215" stroke="#27272a" stroke-width="1" />
    <text x="25" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a" font-weight="600">LAYER 05 // DISTRIBUTED INFRASTRUCTURE &amp; EVENT BUS</text>
    <text x="25" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#f4f4f5" font-weight="700">Apache Kafka Event Bus</text>
    <text x="260" y="50" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717a">·</text>
    <text x="285" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#f4f4f5" font-weight="700">PostgreSQL Transactional Ledger</text>
    <text x="590" y="50" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717a">·</text>
    <text x="615" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#f4f4f5" font-weight="700">Redis Distributed Cache</text>
    <text x="850" y="50" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717a">·</text>
    <text x="875" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#f4f4f5" font-weight="700">Docker &amp; Cloud Native</text>
    <text x="25" y="70" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">Event streaming: PortfolioCreated · StockPurchased · MarketPriceUpdated · RiskAlertTriggered</text>
  </g>
</svg>
